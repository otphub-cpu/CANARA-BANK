<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Update Links</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0056b3;
            --primary-hover: #004494;
            --bg: #f4f7f6;
            --white: #ffffff;
            --text: #333333;
            --border: #dddddd;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            color: var(--text);
        }
        .admin-container { 
            background: var(--white); 
            padding: 2.5rem 2rem; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 450px; 
            text-align: center;
        }
        .admin-icon {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 1rem;
        }
        h1 { 
            margin-top: 0; 
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }
        .form-group { 
            margin-bottom: 1.5rem; 
            text-align: left;
        }
        label { 
            display: block; 
            margin-bottom: 0.5rem; 
            font-weight: 500;
            font-size: 0.95rem;
        }
        input[type="text"], input[type="password"] { 
            width: 100%; 
            padding: 0.85rem; 
            border: 1px solid var(--border); 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            border-color: var(--primary);
            outline: none;
        }
        button { 
            width: 100%; 
            padding: 0.85rem; 
            background-color: var(--primary); 
            color: var(--white); 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 1.05rem; 
            font-weight: 600;
            transition: background-color 0.3s;
        }
        button:hover { 
            background-color: var(--primary-hover); 
        }
        .alert { 
            padding: 0.85rem; 
            margin-bottom: 1.5rem; 
            border-radius: 6px; 
            font-size: 0.95rem;
            text-align: left;
            display: none;
        }
        .alert-danger { 
            background-color: #f8d7da; 
            color: #721c24; 
            border: 1px solid #f5c6cb; 
        }
        .alert-success { 
            background-color: #d4edda; 
            color: #155724; 
            border: 1px solid #c3e6cb; 
        }
        .logout-link { 
            display: inline-block; 
            margin-top: 1.5rem; 
            color: #dc3545; 
            text-decoration: none; 
            font-weight: 500;
            transition: color 0.3s;
        }
        .logout-link:hover { 
            color: #a71d2a; 
            text-decoration: underline; 
        }
        .help-text {
            font-size: 0.85rem;
            color: #777;
            margin-top: 0.4rem;
        }
        
        #login-section, #admin-section {
            display: none;
        }
        #login-section.active, #admin-section.active {
            display: block;
        }
    </style>
</head>
<body>

<div class="admin-container">
    <div class="admin-icon">
        <i class="fa-solid fa-user-shield"></i>
    </div>
    <h1>Website Admin Panel</h1>
    
    <div id="alert-box" class="alert"></div>

    <!-- Login Section -->
    <div id="login-section" class="active">
        <form id="login-form">
            <div class="form-group">
                <label for="password">Enter Password</label>
                <input type="password" id="password" required placeholder="Enter admin password">
            </div>
            <button type="submit"><i class="fa-solid fa-arrow-right-to-bracket"></i> Login</button>
        </form>
    </div>

    <!-- Admin Section -->
    <div id="admin-section">
        <form id="admin-form">
            <div class="form-group">
                <label for="download_url">Download Button Link</label>
                <input type="text" id="download_url" required placeholder="e.g. app.apk or https://google.com">
                <div class="help-text">Enter an APK filename or any web URL (http://...)</div>
            </div>
            <button type="submit"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>
        </form>
        <a href="#" id="logout-btn" class="logout-link"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const loginSection = document.getElementById('login-section');
        const adminSection = document.getElementById('admin-section');
        const loginForm = document.getElementById('login-form');
        const adminForm = document.getElementById('admin-form');
        const passwordInput = document.getElementById('password');
        const downloadUrlInput = document.getElementById('download_url');
        const alertBox = document.getElementById('alert-box');
        const logoutBtn = document.getElementById('logout-btn');

        // Target Password
        const ADMIN_PASSWORD = "200002";

        function showAlert(message, type) {
            alertBox.innerHTML = type === 'success' 
                ? `<i class="fa-solid fa-circle-check"></i> ${message}` 
                : `<i class="fa-solid fa-circle-exclamation"></i> ${message}`;
            alertBox.className = `alert alert-${type}`;
            alertBox.style.display = 'block';
            setTimeout(() => { alertBox.style.display = 'none'; }, 5000);
        }

        // Check login state
        if (sessionStorage.getItem('adminLoggedIn') === 'true') {
            showAdminPanel();
        }

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (passwordInput.value === ADMIN_PASSWORD) {
                sessionStorage.setItem('adminLoggedIn', 'true');
                showAdminPanel();
                passwordInput.value = '';
            } else {
                showAlert('Invalid Password!', 'danger');
            }
        });

        logoutBtn.addEventListener('click', (e) => {
            e.preventDefault();
            sessionStorage.removeItem('adminLoggedIn');
            loginSection.classList.add('active');
            adminSection.classList.remove('active');
            alertBox.style.display = 'none';
        });

        function showAdminPanel() {
            loginSection.classList.remove('active');
            adminSection.classList.add('active');
            
            // Load saved link from localStorage if it exists
            const savedUrl = localStorage.getItem('website_download_link');
            if (savedUrl) {
                downloadUrlInput.value = savedUrl;
            } else {
                downloadUrlInput.value = "HSBC INDIA.apk"; // Default
            }
        }

        adminForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const newUrl = downloadUrlInput.value.trim();
            
            // Save to localStorage
            localStorage.setItem('website_download_link', newUrl);
            
            showAlert('Changes saved locally. Note: Since this is an HTML file, it cannot save data to the server for other users. To do that, we need a database like Firebase.', 'success');
        });
    });
</script>
</body>
</html>
